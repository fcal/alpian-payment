syntax = "proto3";

package alpian.payment.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.alpian.payment.events.v1";
option java_multiple_files = true;

// Protobuf has no decimal type and a double cannot hold money exactly, so the amount is a
// decimal string, e.g. "1234.5600".
message Money {
  string amount = 1;
  // ISO 4217, e.g. "CHF".
  string currency = 2;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_COMPLETED = 1;
  PAYMENT_STATUS_FAILED = 2;
}

// Published once per payment attempt, keyed by account_id so an account's events stay ordered.
// Delivery is at least once: consumers deduplicate on payment_id.
message PaymentEvent {
  string payment_id = 1;
  string account_id = 2;
  string user_id = 3;
  Money amount = 4;
  PaymentStatus status = 5;
  // Set only when status is FAILED.
  string failure_reason = 6;
  string beneficiary_name = 7;
  string reference = 8;
  // When the payment was recorded, not when it was published.
  google.protobuf.Timestamp occurred_at = 9;
}

// The notification sent to the payer, after deduplication.
message NotificationEvent {
  string payment_id = 1;
  string user_id = 2;
  string account_id = 3;
  Money amount = 4;
  PaymentStatus status = 5;
  string message = 6;
  google.protobuf.Timestamp notified_at = 7;
}
