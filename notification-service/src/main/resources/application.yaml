spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: notification-service
      properties:
        # The dedup store, the emitted notification and the input offset commit atomically.
        processing.guarantee: exactly_once_v2
        num.stream.threads: 3
        # A warm copy of the store on another instance makes failover fast.
        num.standby.replicas: 1
    # The delivery listener.
    consumer:
      group-id: notification-dispatcher
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      # Only notifications from committed Streams transactions.
      isolation-level: read_committed
    # Used to dead-letter undeliverable notifications.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all

notification:
  delivery:
    max-attempts: 5
    initial-backoff: 1s
    max-backoff: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8081
