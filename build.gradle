plugins {
    alias(libs.plugins.spotless) apply false
}

allprojects {
    group = 'com.alpian'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: libs.plugins.spotless.get().pluginId

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }

    // bootRun runs in the module directory; point docker-compose at the root compose.yaml.
    plugins.withId('org.springframework.boot') {
        tasks.named('bootRun') {
            systemProperty 'spring.docker.compose.file',
                    rootProject.file('compose.yaml').absolutePath
        }
        // Version-free, so the Dockerfiles need no update on a version bump.
        tasks.named('bootJar') {
            archiveFileName = "${project.name}.jar"
        }
    }

    // Otherwise Boot's dependency management overrides the catalog's Testcontainers version.
    plugins.withId('io.spring.dependency-management') {
        ext['testcontainers.version'] = libs.versions.testcontainers.get()
    }

    spotless {
        java {
            targetExclude '**/build/generated/**'
            googleJavaFormat(libs.versions.googleJavaFormat.get())
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}
