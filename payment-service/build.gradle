plugins {
    id 'java'
    alias(libs.plugins.springBoot)
    alias(libs.plugins.springDependencyManagement)
}

// Component tests live in their own source set. They are black-box: both services run as the
// Docker images their Dockerfiles build, against real Postgres and Kafka containers, and the
// tests reach them only over HTTP, Kafka and SQL. The source set therefore deliberately does not
// see the main classes -- only the shared event contract in :proto.
sourceSets {
    component {}
}

configurations {
    componentImplementation.extendsFrom testImplementation
    componentRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation project(':proto')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Exposes the Actuator metrics in Prometheus text format at /actuator/prometheus.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation libs.springdoc.webmvc
    implementation libs.flyway.core
    runtimeOnly libs.flyway.postgresql
    runtimeOnly libs.postgresql

    // Starts the compose.yaml stack on `bootRun` and wires the datasource / Kafka bootstrap
    // servers from it, so running the service locally needs no manual container management.
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform(libs.testcontainers.bom)
    // @ServiceConnection: wires a Testcontainers database into a full application context.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.kafka
    testImplementation libs.awaitility

    componentImplementation project(':proto')
    componentImplementation 'com.fasterxml.jackson.core:jackson-databind'
    componentImplementation 'org.apache.kafka:kafka-clients'
    componentRuntimeOnly libs.postgresql
}

tasks.register('componentTest', Test) {
    description = 'Runs both services as Docker images against real Postgres and Kafka.'
    group = 'verification'
    testClassesDirs = sourceSets.component.output.classesDirs
    classpath = sourceSets.component.runtimeClasspath
    shouldRunAfter tasks.named('test')

    // The images are built from these jars and Dockerfiles, so a change to any of them -- not
    // only to the code -- reruns the tests.
    def serviceJars = [tasks.named('bootJar'), project(':notification-service').tasks.named('bootJar')]
    dependsOn serviceJars
    inputs.files(serviceJars)
    [projectDir, project(':notification-service').projectDir].each { dir ->
        inputs.files(new File(dir, 'Dockerfile'), new File(dir, '.dockerignore'))
    }
    inputs.file(rootProject.file('docker/kafka/create-topics.sh'))

    systemProperty 'component.payment-service.dir', projectDir.absolutePath
    systemProperty 'component.notification-service.dir',
            project(':notification-service').projectDir.absolutePath
    systemProperty 'component.create-topics', rootProject.file('docker/kafka/create-topics.sh').absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('componentTest')
}
