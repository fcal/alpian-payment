spring:
  application:
    name: payment-service

  # Connection details come from the compose.yaml stack via spring-boot-docker-compose when
  # running locally, and from the environment in any other setting. Defaults are supplied so
  # the service can also be pointed at an already-running Postgres.
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${POSTGRES_USER:payment}
    password: ${POSTGRES_PASSWORD:payment}
    hikari:
      # Payments serialize on a per-account row lock, and a waiting thread holds its
      # connection for the duration of the wait. The pool must therefore be comfortably
      # larger than the expected number of concurrent waiters on a single hot account,
      # otherwise contention on one account can starve unrelated accounts.
      maximum-pool-size: 20
      # Fail fast rather than queueing indefinitely when the pool is exhausted.
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The application owns the schema here, which keeps local setup to a single command.
    # A production deployment would run migrations as a separate step before rollout, so a
    # failed migration cannot take the whole fleet down on restart.

  jackson:
    default-property-inclusion: non_null
    generator:
      # Never render a BigDecimal in exponent notation ("1E+3"), which some clients mis-parse.
      write-bigdecimal-as-plain: true
    deserialization:
      # A payment request with an unexpected field is more likely a client bug -- a misspelt
      # "refrence" silently dropped -- than forward compatibility, so it is rejected.
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # The outbox is the source of truth, so a lost publish is recoverable -- but acks=all
      # plus idempotence keeps duplicate and reordered records out of the happy path.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # The client defaults suit a producer that can wait. This one runs inside a database
        # transaction holding outbox row locks, so a missing broker must surface as a failure in
        # seconds, not minutes: max.block.ms (60s by default) bounds a send() blocked on broker
        # metadata, delivery.timeout.ms (120s) bounds the wait for an acknowledgement. Must stay
        # below payment.outbox.send-timeout so the client gives up before the relay does.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

payment:
  # Bounds how long a payment will wait for the per-account row lock. Without this, a burst
  # on one account pins connections until the pool is exhausted. On timeout the API answers
  # 503 with Retry-After rather than hanging the client.
  lock-timeout: 3s
  outbox:
    relay-enabled: true
    topic: payment-events
    poll-interval: 500ms
    batch-size: 100
    # Attempts before a message failing with a NON-retriable error is parked. Retriable failures
    # (an unreachable broker) are retried indefinitely and never park.
    max-attempts: 5
    initial-backoff: 1s
    max-backoff: 1m
    send-timeout: 15s

server:
  error:
    # Errors are rendered as RFC 9457 ProblemDetail by a @RestControllerAdvice; the default
    # Whitelabel error attributes would leak implementation detail.
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus serves the registry in Prometheus text format. Nothing scrapes
        # it in this setup; it is exposed so the metrics can be inspected directly.
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # Applied to every meter, so one Prometheus can serve both services.
      application: ${spring.application.name}
    distribution:
      # Explicit bucket boundaries rather than `percentiles-histogram: true`. The automatic
      # option emits roughly seventy buckets per timer spanning up to 30s, which for an
      # operation expected to complete in single-digit milliseconds is both a large number of
      # wasted time series and resolution concentrated in the wrong range. These boundaries
      # cover the range that actually occurs, ending at the 3s lock timeout beyond which a
      # request is rejected anyway.
      #
      # Buckets are cumulative and mergeable across replicas, so Prometheus can compute a
      # fleet-wide quantile with histogram_quantile() -- which client-side percentiles cannot
      # do, since percentiles from separate instances are not averageable.
      slo:
        payment.execution: 1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 3s
        payment.lock.wait: 1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 3s
      # Client-side percentiles as well, for single-instance inspection without a Prometheus
      # server to run queries against.
      percentiles:
        payment.execution: 0.5, 0.95, 0.99
        payment.lock.wait: 0.5, 0.95, 0.99
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    # Readiness must reflect Postgres: a service that cannot reach the database cannot take
    # payments and should be pulled from the load balancer. Kafka is deliberately NOT a
    # readiness dependency -- the outbox makes payments survive a Kafka outage, so the
    # service stays available and the relay catches up afterwards.
    db:
      enabled: true

logging:
  pattern:
    # paymentId is placed in the MDC for the duration of a request so a payment can be traced
    # from the API through the outbox to the published event.
    level: "%5p [${spring.application.name:},%X{paymentId:-}]"
