spring:
  application:
    name: payment-service

  # Locally, spring-boot-docker-compose wires these from compose.yaml.
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${POSTGRES_USER:payment}
    password: ${POSTGRES_PASSWORD:payment}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  jackson:
    default-property-inclusion: non_null
    generator:
      write-bigdecimal-as-plain: true
    deserialization:
      # A misspelt field is a client bug, not something to ignore silently.
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        # The relay sends inside a DB transaction: fail within seconds when the broker is down,
        # and before payment.outbox.send-timeout.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        linger.ms: 5

payment:
  # Max wait for the account row lock; beyond it the API answers 503 with Retry-After.
  lock-timeout: 3s
  outbox:
    relay-enabled: true
    topic: payment-events
    poll-interval-ms: 500
    batch-size: 100
    max-attempts: 5
    max-backoff: 1m
    send-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
